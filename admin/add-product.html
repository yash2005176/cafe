<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product | Cafe Hangout Admin</title>

    <link rel="stylesheet" href="css/admin.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="admin-page">

    <div class="admin-layout">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="sidebar-logo">

                <i class="fa-solid fa-mug-hot"></i>

                <span>Cafe Hangout</span>

            </div>

            <nav class="sidebar-nav">

                <a href="dashboard.html">
                    <i class="fa-solid fa-chart-line"></i> Dashboard
                </a>

                <a href="products.html">
                    <i class="fa-solid fa-box"></i> Products
                </a>

                <a href="add-product.html" class="active">
                    <i class="fa-solid fa-plus"></i> Add Product
                </a>

                <a href="messages.html">
                    <i class="fa-solid fa-envelope"></i> Customer Messages
                </a>

                <a href="../index.html" target="_blank" rel="noopener">
                    <i class="fa-solid fa-globe"></i> View Website
                </a>

            </nav>

            <button id="logoutBtn" class="logout-btn">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </button>

        </aside>

        <!-- Main Content -->

        <main class="admin-main">

            <header class="admin-header">

                <div>

                    <h1 id="pageTitle">
                        Add New Product
                    </h1>

                    <p>
                        Add a product to your cafe menu
                    </p>

                </div>

                <a href="products.html" class="btn-secondary">

                    <i class="fa-solid fa-arrow-left"></i> Back to Products

                </a>

            </header>

            <!-- Product Form -->

            <section class="form-card">

                <form id="productForm">

                    <input type="hidden" id="productId">

                    <div class="form-grid">

                        <!-- Product Name -->

                        <div class="form-group">

                            <label for="productName">
                                Product Name *
                            </label>

                            <input type="text" id="productName" placeholder="Enter product name" required>

                        </div>

                        <!-- Price -->

                        <div class="form-group">

                            <label for="productPrice">
                                Price (₹) *
                            </label>

                            <input type="number" id="productPrice" min="0" step="0.01" placeholder="150" required>

                        </div>

                        <div class="form-group">

                            <label for="productCategory">
                                Category *
                            </label>

                            <select id="productCategory" required>
                                <option value="">Loading categories...</option>
                            </select>

                        </div>

                        <!-- Description -->

                        <div class="form-group full-width">

                            <label for="productDescription">
                                Description
                            </label>

                            <textarea id="productDescription" rows="4" placeholder="Describe your product..."></textarea>

                        </div>

                        <!-- Image Upload -->

                        <div class="form-group full-width">

                            <label for="productImage">
                                Product Image
                            </label>

                            <input type="file" id="productImage" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/jpg,image/png,image/webp">

                            <small>
                                JPG, PNG, or WebP; maximum size 5 MB.
                            </small>

                            <div class="image-preview-container">

                                <img id="imagePreview" alt="Product preview" class="image-preview" style="display:none">

                            </div>

                        </div>

                        <!-- Availability -->

                        <div class="form-group checkbox-group">

                            <label>

                                <input
                                    type="checkbox"
                                    id="isAvailable"
                                    checked
                                >

                                Product Available

                            </label>

                        </div>

                        <!-- Featured -->

                        <div class="form-group checkbox-group">

                            <label>

                                <input
                                    type="checkbox"
                                    id="isFeatured"
                                >

                                Featured Product

                            </label>

                        </div>

                    </div>

                    <!-- Buttons -->

                    <div class="form-actions">

                        <a href="products.html" class="btn-secondary">
                            Cancel
                        </a>

                        <button type="submit" id="saveProductBtn" class="btn-primary">

                            <i class="fa-solid fa-save"></i>

                            Save Product

                        </button>

                    </div>

                    <p id="formMessage" class="message" role="status" aria-live="polite"></p>

                </form>

            </section>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/supabase.js"></script>

    <script src="../js/auth.js"></script>

    <script src="js/product-images.js"></script>
    <script src="js/add-product.js"></script>

</body>

</html>
