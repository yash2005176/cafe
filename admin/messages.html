<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Messages | Cafe Hangout Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="admin-page">
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-mug-hot"></i>
                <span>Cafe Hangout</span>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html">
                    <i class="fa-solid fa-chart-line"></i> Dashboard
                </a>
                <a href="products.html">
                    <i class="fa-solid fa-box"></i> Manage Products
                </a>
                <a href="add-product.html">
                    <i class="fa-solid fa-plus"></i> Add Product
                </a>
                <a href="messages.html" class="active" aria-current="page">
                    <i class="fa-solid fa-envelope"></i> Customer Messages
                </a>
                <a href="../index.html" target="_blank" rel="noopener noreferrer">
                    <i class="fa-solid fa-globe"></i> View Website
                </a>
            </nav>

            <button id="logoutBtn" class="logout-btn" type="button">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </button>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div>
                    <h1>Customer Messages</h1>
                    <p>Review enquiries submitted through the Contact page.</p>
                </div>
                <a href="dashboard.html" class="btn-secondary">
                    <i class="fa-solid fa-arrow-left"></i> Dashboard
                </a>
            </header>

            <p id="messagesStatus" class="message" role="status" aria-live="polite">
                Loading messages...
            </p>
            <section id="messagesList" class="messages-list" aria-label="Customer messages"></section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="js/messages.js"></script>
</body>

</html>
