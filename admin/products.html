<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products | Cafe Hangout Admin</title>

    <link rel="stylesheet" href="css/admin.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="admin-page">

    <div class="admin-layout">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="sidebar-logo">

                <i class="fa-solid fa-mug-hot"></i>

                <span>Cafe Hangout</span>

            </div>

            <nav class="sidebar-nav">

                <a href="dashboard.html">
                    <i class="fa-solid fa-chart-line"></i> Dashboard
                </a>

                <a href="products.html" class="active">
                    <i class="fa-solid fa-box"></i> Products
                </a>

                <a href="add-product.html">
                    <i class="fa-solid fa-plus"></i> Add Product
                </a>

                <a href="messages.html">
                    <i class="fa-solid fa-envelope"></i> Customer Messages
                </a>

                <a href="../index.html" target="_blank" rel="noopener">
                    <i class="fa-solid fa-globe"></i> View Website
                </a>

            </nav>

            <button id="logoutBtn" class="logout-btn">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </button>

        </aside>

        <!-- Main -->

        <main class="admin-main">

            <header class="admin-header">

                <div>

                    <h1>Products</h1>

                    <p>Manage your cafe menu products</p>

                </div>

                <a href="add-product.html" class="btn-primary">

                    <i class="fa-solid fa-plus"></i> Add Product

                </a>

            </header>

            <!-- Search and Filters -->

            <section class="product-toolbar">

                <div class="search-box">

                    <i class="fa-solid fa-search"></i>

                    <input type="search" id="searchProduct" placeholder="Search products...">

                </div>

                <select id="categoryFilter">

                    <option value="">All Categories</option>

                </select>

                <select id="statusFilter">

                    <option value="">All Status</option>

                    <option value="available">
                        Available
                    </option>

                    <option value="unavailable">
                        Unavailable
                    </option>

                </select>

            </section>

            <!-- Products Table -->

            <section class="dashboard-section">

                <div class="table-container">

                    <table>

                        <thead>

                            <tr>

                                <th>Image</th>

                                <th>Name</th>

                                <th>Category</th>

                                <th>Price</th>

                                <th>Status</th>

                                <th>Actions</th>

                            </tr>

                        </thead>

                        <tbody id="productsTable">

                            <tr>

                                <td colspan="6">
                                    Loading products...
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

                <p id="productsMessage" class="message"></p>

            </section>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/supabase.js"></script>

    <script src="../js/auth.js"></script>

    <script src="js/product-images.js"></script>
    <script src="js/products.js"></script>

</body>

</html>
